name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate GitHub stats
        run: python3 .github/scripts/profile-stats.py
      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&locale=cn&langs_count=7
          path: profile/top-langs.svg
      - name: Commit updated cards
        run: |
          if ! grep -q 'data-testid="lang-items"' profile/top-langs.svg; then
            echo 'Top languages card did not contain language data.'
            exit 1
          fi
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile cards'
          git push
